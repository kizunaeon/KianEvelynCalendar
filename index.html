<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWARD WATCH BOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171c;
    --board: #1b1f26;
    --flap: #21262e;
    --flap-dark: #171b21;
    --hinge: #0a0c0f;
    --amber: #ffb100;
    --amber-dim: #7a5a12;
    --paper: #eef0ea;
    --muted: #8b93a1;
    --muted-dim: #565c66;
    --green: #5ad18f;
    --red: #ff6b5e;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse at top, #1a1e25 0%, #0e1013 70%);
    color: var(--paper);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding: 24px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width: 480px; margin: 0 auto; position: relative; }

  .themeToggle{
    position:absolute; top:0; right:0;
    width:34px; height:34px; border-radius:50%;
    background: var(--flap); border:1px solid #272c34;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; cursor:pointer;
  }
  .headerText{ padding: 0 42px; }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted-dim);
    text-align:center;
    margin-bottom: 4px;
  }
  .title{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 22px;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  /* new-trip form */
  .searchForm{
    background: var(--flap);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 22px;
    border: 1px solid #272c34;
  }
  .tripTypeTabs{ display:flex; gap:6px; margin-bottom: 14px; }
  .tripTab{
    flex:1;
    font-family:'Inter', sans-serif;
    font-size: 12px; font-weight:600;
    background: #14171c; color: var(--muted);
    border: 1px solid #2a2f38; border-radius: var(--radius);
    padding: 9px 4px; cursor:pointer;
  }
  .tripTab.active{ background: var(--amber); color:#201400; border-color: var(--amber); }

  .legRow{
    background: rgba(255,255,255,0.02);
    border: 1px solid #262b33;
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
  }
  .legLabel{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--amber);
    margin-bottom: 8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .removeLegBtn{
    background:none; border:none; color: var(--muted-dim);
    font-size: 11px; text-decoration:underline; cursor:pointer; padding:2px;
  }
  .formRow{ display:flex; gap:10px; }
  .field{ flex:1; }
  .field label{
    display:block; font-size:11px; color:var(--muted);
    letter-spacing: 0.5px; margin-bottom: 5px;
  }
  .field select, .field input{
    width:100%; background:#14171c; border:1px solid #2a2f38; color:var(--paper);
    padding:10px 8px; border-radius:4px; font-family:'Space Mono',monospace;
    font-size:14px; font-weight:700;
    -webkit-appearance:none; appearance:none;
  }
  .field select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b93a1'/></svg>");
    background-repeat:no-repeat;
    background-position: right 10px center;
  }
  .field input[type="date"]{ font-size:14px; }
  .field select:focus, .field input:focus{ outline:none; border-color: var(--amber-dim); }
  .addLegBtn{
    width:100%;
    background: #14171c; color: var(--muted);
    border: 1px dashed #2a2f38; border-radius: var(--radius);
    padding: 10px; font-size: 12px; font-weight:600; cursor:pointer;
    margin-bottom: 4px;
  }
  .addBtn{
    width:100%; margin-top:10px;
    background: var(--amber); color:#201400;
    padding: 13px; font-size:14px;
    border:none; border-radius:var(--radius); font-weight:600; cursor:pointer;
  }
  .addBtn:active{ transform: scale(0.98); }
  .formMsg{
    margin-top:10px; font-size:12px; color:var(--red); text-align:center; display:none;
  }

  .listTitle{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted-dim);
    margin-bottom: 10px;
  }
  .controlBar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 10px;
    gap: 8px;
  }
  .filterTabs{ display:flex; gap:6px; }
  .tabBtn{
    font-family:'Inter', sans-serif;
    font-size: 11px; font-weight:600;
    background: #23272f; color: var(--muted);
    border: 1px solid #2a2f38; border-radius: 999px;
    padding: 6px 12px; cursor:pointer;
  }
  .tabBtn.active{ background: var(--amber); color:#201400; border-color: var(--amber); }
  .sortSelect{
    background:#23272f; color:var(--muted); border:1px solid #2a2f38;
    border-radius: 999px; padding:6px 10px; font-size:11px;
    font-family:'Inter', sans-serif; -webkit-appearance:none; appearance:none;
  }

  .batchBar{ margin-bottom: 10px; }
  .batchBtn{
    width:100%;
    background: #23272f; color: var(--muted);
    border: 1px solid #2a2f38; border-radius: var(--radius);
    padding: 10px; font-size: 12px; font-weight:600; cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .batchBtn:active{ transform: scale(0.98); }

  /* trip cards */
  .trip{
    background: linear-gradient(180deg, var(--board), #14171c);
    border-radius: 12px;
    border: 1px solid #262b33;
    margin-bottom: 10px;
    overflow:hidden;
  }
  .trip.hot{
    border-color: rgba(255,177,0,0.5);
    box-shadow: 0 0 0 1px rgba(255,177,0,0.25);
  }
  .trip.archived{ opacity: 0.55; }
  .tripHead{
    display:flex; align-items:flex-start; gap:10px;
    padding: 14px;
    cursor:pointer;
  }
  .tripHeadMain{ flex:1; min-width:0; }
  .tripRouteRow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tripRoute{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 15px;
  }
  .tripRoute .arrow{ color: var(--amber); margin: 0 2px; }
  .tripTypeBadge{
    font-family:'Inter', sans-serif;
    font-size: 10px; font-weight:600;
    color: var(--muted);
    background: #23272f;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .tripMeta{
    font-size: 11px;
    color: var(--muted);
    font-family:'Space Mono', monospace;
    margin-top: 4px;
  }
  .tripNote{
    font-size: 12px;
    color: var(--paper);
    font-style: italic;
    margin-top: 4px;
    opacity: 0.85;
  }
  .metaEditRow{
    display:flex; gap:10px;
    padding-top: 14px;
    margin-bottom: 4px;
  }
  .hotBadge{ font-size: 10px; color: var(--amber); margin-top: 3px; }
  .staleBadge{ font-size: 10px; color: var(--muted-dim); margin-top: 3px; }

  .miniFlapStack{
    display:flex; flex-direction:column; gap:4px; align-items:flex-end;
    flex-shrink:0;
  }
  .miniFlap{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 10px;
    letter-spacing:0.5px;
    padding: 4px 8px;
    border-radius: 4px;
    background: var(--flap);
    color: var(--muted);
    white-space:nowrap;
  }
  .miniFlap.open{ color: var(--green); background: rgba(90,209,143,0.12); }
  .miniFlap.booked{ color: var(--amber); background: rgba(255,177,0,0.12); }

  .caret{
    color: var(--muted-dim);
    font-size: 12px;
    transition: transform 0.2s;
    flex-shrink:0;
    margin-top: 4px;
  }
  .trip.expanded .caret{ transform: rotate(180deg); }

  .tripBody{
    display:none;
    padding: 0 14px 16px;
    border-top: 1px solid #23272f;
  }
  .trip.expanded .tripBody{ display:block; }

  .legBlock{
    padding-top: 14px;
    margin-bottom: 6px;
    border-bottom: 1px solid #1f242b;
    padding-bottom: 14px;
  }
  .legsWrap .legBlock:last-child{ border-bottom:none; }
  .legBlockHead{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 10px; flex-wrap:wrap; gap:4px;
  }
  .legBlockLabel{
    font-family:'Space Mono', monospace;
    font-size: 11px; color: var(--amber); letter-spacing:1px;
  }
  .legBlockRoute{
    font-family:'Space Mono', monospace;
    font-size: 12px; color: var(--muted);
  }

  .actions{ display:flex; gap:8px; margin: 0 0 10px; }
  button.act{
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    border:none;
    border-radius: var(--radius);
    padding: 11px 4px;
    cursor:pointer;
    flex:1;
  }
  button.act:active{ transform: scale(0.96); }
  .btn-na{ background: #2a2f38; color: var(--paper); }
  .btn-open{ background: var(--green); color: #08170f; }
  .btn-booked{ background: var(--amber); color: #201400; }

  .goLink{
    display:block; text-align:center;
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    text-decoration:none;
    padding: 10px;
    border-radius: var(--radius);
    font-weight:600; font-size:12px;
    margin-bottom: 8px;
  }
  .goLink.primary{
    background: var(--amber);
    color: #201400;
    border-color: var(--amber);
    margin: 14px 0 6px;
  }
  .cashLink{
    display:block; text-align:center;
    background: transparent;
    border: 1px solid #2a2f38;
    color: var(--muted);
    text-decoration:none;
    padding: 9px;
    border-radius: var(--radius);
    font-weight:600; font-size:11px;
    margin-bottom: 10px;
  }

  .log-list{ display:flex; flex-direction:column; }
  .log-entry{
    display:flex; justify-content:space-between; align-items:center;
    padding: 7px 2px;
    border-bottom: 1px solid #23272f;
    font-size: 12px;
  }
  .log-entry .when{ color: var(--muted); font-family:'Space Mono', monospace; font-size: 11px; }
  .log-entry .result{ font-weight:600; }
  .log-entry .result.na{ color: var(--muted); }
  .log-entry .result.open{ color: var(--green); }
  .log-entry .result.booked{ color: var(--amber); }
  .emptyLog{ text-align:center; color: var(--muted-dim); font-size: 12px; padding: 6px 0 2px; }

  .delRow{ text-align:center; margin-top: 6px; padding-top: 10px; }
  .delBtn{
    background:none; border:none; color: var(--muted-dim);
    font-size: 11px; text-decoration:underline; cursor:pointer; padding:6px;
  }
  .delBtn.confirming{ color: var(--red); }

  .empty-state{
    text-align:center; color: var(--muted-dim); font-size: 13px; padding: 30px 0;
  }

  .archiveSection{ margin-top: 18px; }
  .archiveHead{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted-dim);
    margin-bottom: 10px;
    padding: 4px 0;
  }
  .archiveHead .caret{ font-size:11px; margin-top:0; }

  .tip{
    margin-top: 18px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    text-align:center;
  }
  .tip b{ color: var(--muted); }
  .warn{
    margin-top: 14px;
    background: rgba(139,147,161,0.10);
    border: 1px solid #2a2f38;
    color: var(--muted);
    font-size: 12px;
    padding: 10px 12px;
    border-radius: var(--radius);
    text-align:center;
    line-height:1.5;
  }

  .backupToggle{
    margin-top: 20px;
    text-align:center;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
    cursor:pointer;
  }
  .backupPanel{
    margin-top: 12px;
    background: var(--flap);
    border-radius: var(--radius);
    border: 1px solid #272c34;
    padding: 14px;
  }
  .backupPanel label{
    display:block; font-size:11px; color:var(--muted); margin-bottom:6px;
  }
  .backupPanel textarea{
    width:100%; height: 90px;
    background:#14171c; border:1px solid #2a2f38; color:var(--paper);
    font-family:'Space Mono', monospace; font-size:11px;
    border-radius:4px; padding:8px; resize:vertical;
    margin-bottom: 8px;
  }
  .backupRow{ display:flex; gap:8px; margin-bottom: 14px; }
  .backupRow button{
    flex:1; font-family:'Inter', sans-serif; font-weight:600; font-size:12px;
    border:none; border-radius:var(--radius); padding:10px; cursor:pointer;
  }
  .copyBtn{ background:#2a2f38; color:var(--paper); }
  .restoreBtn{ background: var(--amber); color:#201400; }
  .restoreBtn.confirming{ background: var(--red); color:#2a0500; }
  .backupMsg{ font-size:11px; color:var(--muted); text-align:center; margin-top:-4px; margin-bottom:10px; display:none; }
  .hr{ border:none; border-top:1px solid #2a2f38; margin:14px 0; }

  body.light-theme{
    --bg: #f3f1ea;
    --board: #ffffff;
    --flap: #ece9e0;
    --flap-dark: #e2ded2;
    --hinge: #cfc9ba;
    --amber: #a15c00;
    --amber-dim: #c9a15c;
    --paper: #1c1f24;
    --muted: #5b6270;
    --muted-dim: #8a90a0;
    --green: #1f8f57;
    --red: #c73b2e;
  }
  body.light-theme{
    background: radial-gradient(ellipse at top, #ffffff 0%, #ece8dd 70%);
  }
  body.light-theme .miniFlap.open{ background: rgba(31,143,87,0.12); }
  body.light-theme .miniFlap.booked{ background: rgba(161,92,0,0.12); }
</style>

<body>
<div class="wrap">
  <button class="themeToggle" id="themeToggleBtn" onclick="toggleTheme()">☀️</button>
  <div class="headerText">
    <div class="eyebrow">ATMOS REWARDS</div>
    <div class="title">AWARD WATCH BOARD</div>
  </div>

  <div class="searchForm">
    <div class="tripTypeTabs">
      <button class="tripTab" id="tabOneway" onclick="setTripType('oneway')">單程</button>
      <button class="tripTab" id="tabRoundtrip" onclick="setTripType('roundtrip')">來回</button>
      <button class="tripTab" id="tabMulti" onclick="setTripType('multi')">多趟</button>
    </div>
    <div id="legsFormArea"></div>
    <div class="formRow" style="margin-bottom:10px;">
      <div class="field">
        <label>人數</label>
        <select id="paxSelect" onchange="newPax=parseInt(this.value,10)">
          <option value="1">1 人</option>
          <option value="2">2 人</option>
          <option value="3">3 人</option>
          <option value="4">4 人</option>
          <option value="5">5 人</option>
          <option value="6">6 人</option>
        </select>
      </div>
      <div class="field" style="flex:2;">
        <label>備註（選填）</label>
        <input type="text" id="noteInput" placeholder="例如：福岡演唱會來回" maxlength="60" onchange="newNote=this.value" style="font-weight:400; font-family:'Inter',sans-serif; text-transform:none;" />
      </div>
    </div>
    <button class="addBtn" onclick="addTrip()">＋ 開始追蹤這個行程</button>
    <div class="formMsg" id="formMsg"></div>
  </div>

  <div class="listTitle">追蹤中的行程</div>
  <div class="controlBar">
    <div class="filterTabs">
      <button class="tabBtn" id="tabAll" onclick="setFilter('all')">全部</button>
      <button class="tabBtn" id="tabHot" onclick="setFilter('hot')">🔥 熱區</button>
    </div>
    <select class="sortSelect" id="sortSelect" onchange="setSort(this.value)">
      <option value="date">依日期排序</option>
      <option value="lastChecked">依查詢時間排序</option>
    </select>
  </div>
  <div class="batchBar" id="batchBar"></div>
  <div id="tripList"></div>
  <div id="archiveSection"></div>

  <div class="tip"><b>提示：</b>Alaska 通常於起飛前約 330 天開票，但夥伴航空艙位常在起飛前 1–3 個月因艙位管理而釋出，那段期間可以提高查詢頻率。</div>
  <div class="warn" id="saveWarn" style="display:none;">ⓘ 這個裝置目前無法保存查詢紀錄，資料只在這次開啟期間有效，離開或重新整理頁面後會清空。</div>

  <div class="backupToggle" id="backupToggle" onclick="toggleBackupPanel()">備份與還原 ▾</div>
  <div class="backupPanel" id="backupPanel" style="display:none;">
    <label>備份文字（可複製到備忘錄保存）</label>
    <textarea id="backupText" readonly></textarea>
    <div class="backupRow">
      <button class="copyBtn" onclick="copyBackupText()">複製</button>
    </div>
    <div class="backupMsg" id="backupMsg"></div>
    <hr class="hr" />
    <label>貼上備份文字還原</label>
    <textarea id="restoreText" placeholder="貼上之前複製的備份文字"></textarea>
    <div class="backupRow">
      <button class="restoreBtn" id="restoreBtnEl" onclick="restoreBackup()">還原（會覆蓋目前清單）</button>
    </div>
  </div>
</div>

<script>
/*
  This is the standalone-deploy variant (e.g. for Netlify).
  window.storage is a special API that only exists inside Claude.ai's
  artifact preview — it does not exist in a normal deployed website.
  This shim replaces it with a localStorage-backed adapter that matches
  the same {get, set, delete} shape, so none of the app logic below
  needs to change.
*/
window.storage = {
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('key not found: ' + key);
    return { key, value: v };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key){
    localStorage.removeItem(key);
    return { key, deleted: true };
  }
};

const TRIPS_KEY = 'award-watch:trips';
const OLD_WATCHES_KEY = 'award-watch:watches';

const STARLUX_AIRPORTS = [
  {code:'TPE', name:'台北 桃園'},
  {code:'RMQ', name:'台中'},
  {code:'FUK', name:'福岡'},

  {code:'SDJ', name:'仙台'},
  {code:'OKA', name:'沖繩'},
  {code:'HKD', name:'函館'},
  {code:'KMJ', name:'熊本'},
  {code:'TAK', name:'高松'},
  {code:'SHI', name:'下地島 宮古'},
  {code:'HKG', name:'香港'},
  {code:'MFM', name:'澳門'},
  {code:'PUS', name:'釜山'},

  {code:'DAD', name:'峴港'},
  {code:'PQC', name:'富國島'},

  {code:'SIN', name:'新加坡'},
  {code:'MNL', name:'馬尼拉'},
  {code:'CEB', name:'宿霧'},
  {code:'CRK', name:'安吉利斯(克拉克)'},
  {code:'DPS', name:'峇里島'},
  {code:'CGK', name:'雅加達'},
  {code:'LAX', name:'洛杉磯'},
  {code:'SFO', name:'舊金山'},
  {code:'SEA', name:'西雅圖'},
  {code:'ONT', name:'安大略(南加州)'},
  {code:'PHX', name:'鳳凰城'},
  {code:'PRG', name:'布拉格'}
];

let trips = [];
let storageAvailable = true;
let expandedId = null;
let confirmingDeleteId = null;
let confirmingDeleteTimer = null;
let archiveOpen = false;
let backupPanelOpen = false;
let restoreConfirming = false;
let restoreConfirmTimer = null;
let lightTheme = false;
let filterMode = 'all';

let newTripType = 'oneway';
let newLegs = [];
let newReturnDate = '';
let newPax = 1;
let newNote = '';

function makeId(){
  return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}

function todayLocal(){
  const now = new Date();
  return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
}

function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ---------- new-trip form ---------- */

function setTripType(type){
  newTripType = type;
  const base = todayLocal();
  if(type === 'oneway'){
    newLegs = [{ origin:'FUK', dest:'TPE', date: base }];
  } else if(type === 'roundtrip'){
    newLegs = [{ origin:'FUK', dest:'TPE', date: base }];
    newReturnDate = addDays(base, 7);
  } else {
    newLegs = [
      { origin:'FUK', dest:'TPE', date: base },

async function addTrip(){
  const msg = document.getElementById('formMsg');

  if(newTripType === 'roundtrip'){
    if(!newLegs[0].date || !newReturnDate){
      msg.textContent = '請確認去程和回程日期都選了';
      msg.style.display = 'block';
      return;
    }
    if(newLegs[0].origin === newLegs[0].dest){
      msg.textContent = '出發地跟抵達地不能一樣';
      msg.style.display = 'block';
      return;
    }
    if(newReturnDate < newLegs[0].date){
      msg.textContent = '回程日期不能早於去程日期';
      msg.style.display = 'block';
      return;
    }
    msg.style.display = 'none';

    const out = newLegs[0];
    const trip = {
      id: makeId(),
      type: 'roundtrip',
      pax: newPax,
      note: newNote.trim().slice(0,60),

        { id: makeId(), origin: out.dest, dest: out.origin, date: newReturnDate, log: [] }
      ]
    };
    trips.unshift(trip);
    expandedId = trip.id;
    await saveTrips();
    resetForm();
    render();
    return;
  }

  for(const leg of newLegs){
    if(!leg.date){
      msg.textContent = '請確認每一段都選了日期';

      return;
    }

      msg.style.display = 'block';
      return;
    }
  }

    type: newTripType,
    pax: newPax,
    note: newNote.trim().slice(0,60),

/* ---------- helpers ---------- */

function isBooked(trip){
  return trip.legs.every(l => l.log[0] && l.log[0].result === 'booked');
}

function daysUntil(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  return Math.ceil((target - now) / (1000*60*60*24));
}

function isHotWindow(dateStr){
  const days = daysUntil(dateStr);
  return days >= 0 && days <= 90 && days >= 30;
}

function daysSinceLastCheck(leg){
  if(!leg.log[0]) return null;
  return Math.floor((Date.now() - leg.log[0].ts) / (1000*60*60*24));
}

function resultLabel(r){
  return r === 'open' ? '有票' : r === 'booked' ? '已訂到' : '無票';
}

function formatWhen(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit'}) + ' ' + d.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false});
}

function tripTypeLabel(type){
  return type === 'roundtrip' ? '來回' : type === 'multi' ? '多趟' : '單程';
}

function tripRouteHtml(trip){
  if(trip.type === 'roundtrip'){
    return `${trip.legs[0].origin}<span class="arrow">⇄</span>${trip.legs[0].dest}`;
  }
  if(trip.type === 'multi'){
    const codes = [trip.legs[0].origin, ...trip.legs.map(l => l.dest)];
    return codes.join('<span class="arrow">✈</span>');
  }
  return `${trip.legs[0].origin}<span class="arrow">✈</span>${trip.legs[0].dest}`;
}

function tripEarliestUpcomingDays(trip){
  const upcoming = trip.legs.map(l => daysUntil(l.date)).filter(d => d >= 0);
  if(upcoming.length > 0) return Math.min(...upcoming);
  const all = trip.legs.map(l => daysUntil(l.date));
  return Math.max(...all);
}

function tripIsHot(trip){
  return trip.legs.some(l => isHotWindow(l.date));
}

function tripSortDate(trip){
  return trip.legs.reduce((min, l) => (l.date < min ? l.date : min), trip.legs[0].date);
}

function tripStaleInfo(trip){
  let worst = null;
  trip.legs.forEach(l => {
    if(l.log[0] && l.log[0].result === 'booked') return;
    const d = daysSinceLastCheck(l);
    if(d === null) return;
    if(worst === null || d > worst) worst = d;
  });
  if(worst === null) return null;
  return worst >= 3 ? worst : null;
}

function tripSortStaleness(trip){
  let worst = -1;
  trip.legs.forEach(l => {
    if(l.log[0] && l.log[0].result === 'booked') return;
    const d = daysSinceLastCheck(l);
    const val = d === null ? Infinity : d;
    if(val > worst) worst = val;
  });
  return worst;
}

/* ---------- persistence ---------- */

async function saveTrips(){
  if(!storageAvailable) return false;
  try{
    const result = await window.storage.set(TRIPS_KEY, JSON.stringify(trips));
    if(result) return true;
  }catch(e){
    console.error('storage save failed', e);
  }
  storageAvailable = false;
  document.getElementById('saveWarn').style.display = 'block';
  return false;
}

function sanitizeLeg(l){
  if(!l || typeof l.origin !== 'string' || typeof l.dest !== 'string' || typeof l.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(l.date)) return null;
  const validResults = ['na','open','booked'];
  return {
    id: (typeof l.id === 'string' && l.id) ? l.id : makeId(),
    origin: l.origin.toUpperCase().slice(0,4),
    dest: l.dest.toUpperCase().slice(0,4),
    date: l.date,
    log: Array.isArray(l.log) ? l.log.filter(e => e && typeof e.ts === 'number' && validResults.includes(e.result)) : []
  };
}

function sanitizePax(p){
  const n = parseInt(p, 10);
  if(!Number.isFinite(n) || n < 1) return 1;
  return Math.min(n, 9);
}

function sanitizeNote(n){
  return (typeof n === 'string') ? n.trim().slice(0,60) : '';
}

function sanitizeTrips(arr){
  if(!Array.isArray(arr)) return null;
  const clean = [];
  for(const item of arr){
    if(!item) continue;
    if(Array.isArray(item.legs)){
      const legs = item.legs.map(sanitizeLeg).filter(Boolean);
      if(legs.length === 0) continue;
      clean.push({
        id: (typeof item.id === 'string' && item.id) ? item.id : makeId(),
        type: ['oneway','roundtrip','multi'].includes(item.type) ? item.type : (legs.length === 1 ? 'oneway' : legs.length === 2 ? 'roundtrip' : 'multi'),
        pax: sanitizePax(item.pax),
        note: sanitizeNote(item.note),
        legs
      });
    } else {
      const leg = sanitizeLeg(item);
      if(leg) clean.push({ id: makeId(), type:'oneway', pax: 1, note: '', legs:[leg] });
    }
  }
  return clean;
}

async function loadAll(){
  setTripType('oneway');

  let hadStoredData = false;
  try{
    const t = await window.storage.get(TRIPS_KEY);
    if(t && t.value){
      trips = sanitizeTrips(JSON.parse(t.value)) || [];
      hadStoredData = true;
    }
  }catch(e){}

  if(!hadStoredData){
    try{
      const old = await window.storage.get(OLD_WATCHES_KEY);
      if(old && old.value){
        const migrated = sanitizeTrips(JSON.parse(old.value));
        if(migrated && migrated.length > 0){
          trips = migrated;
          hadStoredData = true;
          await saveTrips();
          try{ await window.storage.delete(OLD_WATCHES_KEY); }catch(e){}
        }
      }
    }catch(e){}
  }

  if(trips.length === 0 && !hadStoredData){
    trips.push({
      id: makeId(), type:'oneway', pax: 1, note: '',
      legs: [{ id: makeId(), origin:'FUK', dest:'TPE', date:'2026-11-02', log:[] }]
    });
  }
  render();
}

/* ---------- actions ---------- */

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}

async function updateTripField(tripId, field, value){
  const trip = trips.find(t => t.id === tripId);
  if(!trip) return;
  if(field === 'pax') trip.pax = sanitizePax(value);
  else if(field === 'note') trip.note = sanitizeNote(value);
  await saveTrips();
  render();
}

async function logCheck(tripId, legId, result){
  const trip = trips.find(t => t.id === tripId);
  if(!trip) return;
  const leg = trip.legs.find(l => l.id === legId);
  if(!leg) return;
  leg.log.unshift({ ts: Date.now(), result });
  await saveTrips();
  render();
}

function toggleExpand(id){
  expandedId = (expandedId === id) ? null : id;
  confirmingDeleteId = null;
  clearTimeout(confirmingDeleteTimer);
  render();
}

async function deleteTrip(id){
  if(confirmingDeleteId !== id){
    confirmingDeleteId = id;
    render();
    clearTimeout(confirmingDeleteTimer);
    confirmingDeleteTimer = setTimeout(() => {
      if(confirmingDeleteId === id){
        confirmingDeleteId = null;
        render();
      }
    }, 4000);
    return;
  }
  clearTimeout(confirmingDeleteTimer);
  trips = trips.filter(t => t.id !== id);
  confirmingDeleteId = null;
  if(expandedId === id) expandedId = null;
  await saveTrips();
  render();
}

async function batchMarkNA(){
  const display = getDisplayTrips();
  if(display.length === 0) return;
  const ts = Date.now();
  display.forEach(t => {
    t.legs.forEach(l => {
      if(!(l.log[0] && l.log[0].result === 'booked')){
        l.log.unshift({ ts, result:'na' });
      }
    });
  });
  await saveTrips();
  render();
}

function toggleArchive(){
  archiveOpen = !archiveOpen;
  render();
}

function toggleTheme(){
  lightTheme = !lightTheme;
  document.body.classList.toggle('light-theme', lightTheme);
  document.getElementById('themeToggleBtn').textContent = lightTheme ? '🌙' : '☀️';
}

function setFilter(mode){
  filterMode = mode;
  render();
}

function setSort(mode){
  sortMode = mode;
  render();
}

function getDisplayTrips(){
  let list = trips.filter(t => !isBooked(t));
  if(filterMode === 'hot'){
    list = list.filter(t => tripIsHot(t));
  }
  if(sortMode === 'lastChecked'){
    list.sort((a,b) => tripSortStaleness(b) - tripSortStaleness(a));
  } else {
    list.sort((a,b) => tripSortDate(a).localeCompare(tripSortDate(b)));
  }
  return list;
}

function toggleBackupPanel(){
  backupPanelOpen = !backupPanelOpen;
  const panel = document.getElementById('backupPanel');
  panel.style.display = backupPanelOpen ? 'block' : 'none';
  if(backupPanelOpen) refreshBackupText();
}

function refreshBackupText(){
  document.getElementById('backupText').value = JSON.stringify(trips);
}

async function copyBackupText(){
  const text = document.getElementById('backupText').value;
  const msg = document.getElementById('backupMsg');
  try{
    await navigator.clipboard.writeText(text);
    msg.textContent = '已複製到剪貼簿';
  }catch(e){
    const ta = document.getElementById('backupText');
    ta.focus();
    ta.select();
    msg.textContent = '無法自動複製，文字已選取，請手動長按複製';
  }
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 3000);
}

async function restoreBackup(){
  const btn = document.getElementById('restoreBtnEl');
  const raw = document.getElementById('restoreText').value.trim();
  if(!raw) return;

  if(!restoreConfirming){
    let clean;
    try{ clean = sanitizeTrips(JSON.parse(raw)); }catch(e){ clean = null; }
    if(!clean || clean.length === 0){
      btn.textContent = '格式錯誤，請確認貼上的是完整備份文字';
      setTimeout(() => { btn.textContent = '還原（會覆蓋目前清單）'; }, 3000);
      return;
    }
    restoreConfirming = true;
    btn.textContent = '再按一次確認還原（會覆蓋目前清單）';
    btn.classList.add('confirming');
    clearTimeout(restoreConfirmTimer);
    restoreConfirmTimer = setTimeout(() => {
      restoreConfirming = false;
      btn.textContent = '還原（會覆蓋目前清單）';
      btn.classList.remove('confirming');
    }, 5000);
    return;
  }

  clearTimeout(restoreConfirmTimer);
  restoreConfirming = false;
  btn.classList.remove('confirming');
  btn.textContent = '還原（會覆蓋目前清單）';

  let clean;
  try{ clean = sanitizeTrips(JSON.parse(raw)); }catch(e){ clean = null; }
  if(!clean || clean.length === 0){
    btn.textContent = '格式錯誤，還原已取消';
    setTimeout(() => { btn.textContent = '還原（會覆蓋目前清單）'; }, 3000);
    return;
  }

  trips = clean;
  expandedId = null;
  await saveTrips();
  render();
  refreshBackupText();
}

/* ---------- render ---------- */

function render(){
  const listEl = document.getElementById('tripList');
  const batchEl = document.getElementById('batchBar');
  const archiveEl = document.getElementById('archiveSection');

  document.getElementById('tabAll').classList.toggle('active', filterMode === 'all');
  document.getElementById('tabHot').classList.toggle('active', filterMode === 'hot');
  document.getElementById('sortSelect').value = sortMode;

  if(trips.length === 0){
    listEl.innerHTML = '<div class="empty-state">還沒有追蹤中的行程，用上面的表單新增一筆</div>';
    batchEl.innerHTML = '';
    archiveEl.innerHTML = '';
    return;
  }

  const allActive = trips.filter(t => !isBooked(t));
  const display = getDisplayTrips();
  const archived = trips.filter(t => isBooked(t)).sort((a,b) => tripSortDate(a).localeCompare(tripSortDate(b)));

  batchEl.innerHTML = display.length > 0
    ? `<button class="batchBtn" onclick="batchMarkNA()">全部標記：還是沒票（${display.length} 個行程）</button>`
    : '';

  if(allActive.length === 0){
    listEl.innerHTML = '<div class="empty-state">目前追蹤中的行程都已訂到，太棒了 🎉</div>';
  } else if(display.length === 0){
    listEl.innerHTML = '<div class="empty-state">目前沒有進入放票熱區的行程</div>';
  } else {
    listEl.innerHTML = display.map(t => renderTripCard(t, false)).join('');
  }

  if(archived.length === 0){
    archiveEl.innerHTML = '';
  } else {
    archiveEl.innerHTML = `
      <div class="archiveHead" onclick="toggleArchive()">
        <span>已訂到（${archived.length}）</span>
        <span class="caret" style="transform: rotate(${archiveOpen ? '180deg' : '0deg'})">▾</span>
      </div>
      ${archiveOpen ? archived.map(t => renderTripCard(t, true)).join('') : ''}
    `;
  }
}

function renderTripCard(trip, archivedStyle){
  const isOpen = expandedId === trip.id;
  const hot = !archivedStyle && tripIsHot(trip);
  const staleDays = archivedStyle ? null : tripStaleInfo(trip);
  const days = tripEarliestUpcomingDays(trip);
  const daysLabel = days >= 0 ? ('距最近航段 ' + days + ' 天') : '已過';

  const miniFlaps = trip.legs.map(l => {
    const latest = l.log[0];
    const flapText = !latest ? 'N/A' : latest.result === 'open' ? 'OPEN' : latest.result === 'booked' ? 'BOOKED' : 'N/A';
    const flapClass = !latest ? '' : latest.result;
    return `<div class="miniFlap ${flapClass}">${flapText}</div>`;
  }).join('');

  const cardClasses = ['trip'];
  if(isOpen) cardClasses.push('expanded');
  if(hot) cardClasses.push('hot');
  if(archivedStyle) cardClasses.push('archived');

  const delLabel = confirmingDeleteId === trip.id ? '再按一次確認刪除整個行程' : '刪除這個行程';
  const delClass = confirmingDeleteId === trip.id ? 'delBtn confirming' : 'delBtn';

  const legsHtml = trip.legs.map((leg, i) => {
    const dateShort = new Date(leg.date + 'T00:00:00').toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit', weekday:'short'});
    const logHtml = leg.log.length === 0
      ? '<div class="emptyLog">還沒有查詢紀錄</div>'
      : '<div class="log-list">' + leg.log.slice(0,20).map(e => `
          <div class="log-entry">
            <span class="when">${formatWhen(e.ts)}</span>
            <span class="result ${e.result}">${resultLabel(e.result)}</span>
          </div>
        `).join('') + '</div>';

    return `
      <div class="legBlock">
        <div class="legBlockHead">
          <span class="legBlockLabel">${legLabelFor(trip.type, i, trip.legs.length)}</span>
          <span class="legBlockRoute">${leg.origin} ✈ ${leg.dest} · ${dateShort}</span>
        </div>
        <div class="actions">
          <button class="act btn-na" onclick="logCheck('${trip.id}','${leg.id}','na')">還是沒票</button>
          <button class="act btn-open" onclick="logCheck('${trip.id}','${leg.id}','open')">有票了！</button>
          <button class="act btn-booked" onclick="logCheck('${trip.id}','${leg.id}','booked')">已訂到</button>
        </div>
        <a class="goLink" href="${buildAlaskaLink(leg, trip.pax)}" target="_blank" rel="noopener">${trip.type !== 'oneway' ? '前往 Alaska 官網查詢（僅此段單程）→' : '前往 Alaska 官網查詢 →'}</a>
        <a class="cashLink" href="${buildSkyscannerLink(leg, trip.pax)}" target="_blank" rel="noopener">${trip.type !== 'oneway' ? '比較這段現金票價 (Skyscanner) →' : '比較這天現金票價 (Skyscanner) →'}</a>
        ${logHtml}
      </div>
    `;
  }).join('');

  return `
    <div class="${cardClasses.join(' ')}">
      <div class="tripHead" onclick="toggleExpand('${trip.id}')">
        <div class="tripHeadMain">
          <div class="tripRouteRow">
            <div class="tripRoute">${tripRouteHtml(trip)}</div>
            <div class="tripTypeBadge">${tripTypeLabel(trip.type)}</div>
            <div class="tripTypeBadge">👤${trip.pax}</div>
          </div>
          ${trip.note ? `<div class="tripNote">${escapeHtml(trip.note)}</div>` : ''}
          <div class="tripMeta">${daysLabel}</div>
          ${hot ? '<div class="hotBadge">🔥 有航段可能開始放票</div>' : ''}
          ${staleDays !== null ? `<div class="staleBadge">⏰ 已經 ${staleDays} 天沒查了</div>` : ''}
        </div>
        <div class="miniFlapStack">${miniFlaps}</div>
        <div class="caret">▾</div>
      </div>
      <div class="tripBody">
        <div class="metaEditRow">
          <div class="field">
            <label>人數</label>
            <select onchange="updateTripField('${trip.id}','pax',this.value)">
              ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${trip.pax===n?'selected':''}>${n} 人</option>`).join('')}
            </select>
          </div>
          <div class="field" style="flex:2;">
            <label>備註</label>
            <input type="text" value="${escapeHtml(trip.note)}" maxlength="60" placeholder="例如：福岡演唱會來回"
              onchange="updateTripField('${trip.id}','note',this.value)"
              style="font-weight:400; font-family:'Inter',sans-serif; text-transform:none;" />
          </div>
        </div>
        ${trip.type === 'roundtrip' ? `<a class="goLink primary" href="${buildAlaskaRoundTripLink(trip)}" target="_blank" rel="noopener">來回查詢 (Alaska 官網，去回程一起看) →</a>
        <a class="cashLink" href="${buildSkyscannerRoundTripLink(trip)}" target="_blank" rel="noopener">比較來回現金票價 (Skyscanner) →</a>` : ''}
        ${trip.type === 'multi' ? `<a class="goLink primary" href="${buildAlaskaMultiCityLink(trip)}" target="_blank" rel="noopener">多趟查詢 (Alaska 官網，全部航段一起看) →</a>
        <a class="cashLink" href="${buildSkyscannerMultiCityLink(trip)}" target="_blank" rel="noopener">比較全部航段現金票價 (Skyscanner) →</a>` : ''}
        <div class="legsWrap">${legsHtml}</div>
        <div class="delRow">
          <button class="${delClass}" onclick="deleteTrip('${trip.id}')">${delLabel}</button>
        </div>
      </div>
    </div>
  `;
}

loadAll();
</script>
</body>
</html>
